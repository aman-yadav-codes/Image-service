services:
  redis:
    image: redis:7.2-alpine
    container_name: media-service-redis
    restart: unless-stopped
    command: >
      redis-server --save 60 1 --loglevel warning --maxmemory ${REDIS_MAX_MEMORY:-512mb} --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - "${DATA_ROOT:-/srv/media-service}/redis:/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - media-net

  minio:
    image: minio/minio:latest
    container_name: media-service-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_BROWSER_REDIRECT_URL: https://new.findmy.co.za/minio-console/
    volumes:
      - "${DATA_ROOT:-/srv/media-service}/minio:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - media-net

  minio-init:
    image: minio/mc:latest
    container_name: media-service-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set public local/$$MINIO_BUCKET &&
      exit 0"
    networks:
      - media-net

  # ──────────────────────────────────────────────────────────────────────────
  # Media API
  # ──────────────────────────────────────────────────────────────────────────

  media-api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: media-service-api

    restart: unless-stopped

    ports:
      - "${PORT:-4000}:4000"

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}

      PORT: 4000
      HOST: "0.0.0.0"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      # Storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}

      # MinIO
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}

      # Rate limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}

      # ──────────────────────────────────────────────────────────────────────
      # Better Auth
      # Media API validates the user's existing FindMy session.
      # findmy-server is reachable through production_default.
      # ──────────────────────────────────────────────────────────────────────

      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://findmy-server:4000}
      AUTH_SESSION_ENDPOINT: ${AUTH_SESSION_ENDPOINT:-/api/auth/get-session}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Secure-better-auth.session_token}
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}

      # Jobs
      JOB_MAX_RETRIES: ${JOB_MAX_RETRIES:-3}
      JOB_BACKOFF_DELAY_MS: ${JOB_BACKOFF_DELAY_MS:-2000}
      JOB_KEEP_COMPLETED_MS: ${JOB_KEEP_COMPLETED_MS:-3600000}
      JOB_KEEP_FAILED_MS: ${JOB_KEEP_FAILED_MS:-86400000}

    depends_on:
      redis:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:4000/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - media-net
      - findmy-net

  # ──────────────────────────────────────────────────────────────────────────
  # Media Worker
  # ──────────────────────────────────────────────────────────────────────────

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.media-worker

    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      # Storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}

      # MinIO
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}

      # Worker
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-1}
      VIDEO_PRESET: ${VIDEO_PRESET:-veryfast}

      # Jobs
      JOB_MAX_RETRIES: ${JOB_MAX_RETRIES:-3}
      JOB_BACKOFF_DELAY_MS: ${JOB_BACKOFF_DELAY_MS:-2000}
      JOB_KEEP_COMPLETED_MS: ${JOB_KEEP_COMPLETED_MS:-3600000}
      JOB_KEEP_FAILED_MS: ${JOB_KEEP_FAILED_MS:-86400000}

      # Image processing
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      IMAGE_MAX_WIDTH: ${IMAGE_MAX_WIDTH:-1920}
      IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-96}
      IMAGE_WEBP_EFFORT: ${IMAGE_WEBP_EFFORT:-0}
      IMAGE_PREFERRED_MIN_BYTES: ${IMAGE_PREFERRED_MIN_BYTES:-51200}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-71680}
      IMAGE_COMPRESSOR_ENGINE: ${IMAGE_COMPRESSOR_ENGINE:-pyvips}
      IMAGE_COMPRESSOR_ALLOW_RESIZE: ${IMAGE_COMPRESSOR_ALLOW_RESIZE:-false}
      VIPS_CONCURRENCY: ${VIPS_CONCURRENCY:-1}

      THUMBNAIL_WIDTH: ${THUMBNAIL_WIDTH:-256}
      THUMBNAIL_HEIGHT: ${THUMBNAIL_HEIGHT:-256}
      THUMBNAIL_QUALITY: ${THUMBNAIL_QUALITY:-75}

      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1280}
      DISPLAY_QUALITY: ${DISPLAY_QUALITY:-82}

      LARGE_WIDTH: ${LARGE_WIDTH:-1920}
      LARGE_QUALITY: ${LARGE_QUALITY:-85}

      PRINT_QUALITY: ${PRINT_QUALITY:-95}
      PRINT_FORMAT: ${PRINT_FORMAT:-jpeg}

    depends_on:
      redis:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    networks:
      - media-net

    deploy:
      replicas: ${MEDIA_WORKER_REPLICAS:-4}
      resources:
        limits:
          cpus: "${MEDIA_WORKER_CPU_LIMIT:-0.75}"
          memory: "${MEDIA_WORKER_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MEDIA_WORKER_CPU_RESERVATION:-0.25}"
          memory: "${MEDIA_WORKER_MEMORY_RESERVATION:-256M}"

# ────────────────────────────────────────────────────────────────────────────
# Networks
# ────────────────────────────────────────────────────────────────────────────

networks:

  # Internal media-service network
  media-net:
    driver: bridge

  # Existing FindMy application network
  # Required for:
  #
  # media-service-api
  #        ↓
  # findmy-server:4000
  #
  # Do NOT create a new network here.
  findmy-net:
    external: true
    name: production_default
