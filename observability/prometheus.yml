global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'image-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['image-api:4000']

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - minio:9000
