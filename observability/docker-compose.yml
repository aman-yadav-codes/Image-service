version: '3.8'

services:
  # ─── Grafana Loki (Log Aggregator) ─────────────────────────────────────────
  loki:
    image: ${LOKI_IMAGE}
    container_name: observability-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - "${DATA_ROOT}/loki:/loki"
    networks:
      - observability-net

  # ─── Prometheus (Metrics Scraper) ──────────────────────────────────────────
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: observability-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - "${DATA_ROOT}/prometheus:/prometheus"
    networks:
      - observability-net

  # ─── Grafana Dashboard ─────────────────────────────────────────────────────
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: observability-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - "${DATA_ROOT}/grafana:/var/lib/grafana"
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - prometheus
      - loki
    networks:
      - observability-net

  # ─── Grafana Promtail (Log Collector) ──────────────────────────────────────
  promtail:
    image: ${PROMTAIL_IMAGE}
    container_name: observability-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_CLIENT_URL: ${LOKI_CLIENT_URL}
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - observability-net

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  observability-net:
    name: observability-net
    external: true
